[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pushbullet.py"
version = "0.12.0"  # Cette valeur sera remplacée par la version réelle lors de la construction
description = "A simple python client for pushbullet.com"
readme = "readme.md"
authors = [
    {name = "Richard Borcsik", email = "borcsikrichard@gmail.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Natural Language :: English",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities"
]
keywords = ["push", "android", "pushbullet", "notification"]
urls = {Homepage = "https://github.com/randomchars/pushbullet.py"}
requires-python = ">=3.11"
dependencies = [
    "websocket-client>=1.0.0",
    "pushbullet.py>=0.12.0",  # Note: Cela semble circulaire, à vérifier
    "pip>=20.0.0",
    "legacy-cgi>=1.0.0"
]

[project.scripts]
# Ajoutez ici les éventuels scripts d'entrée si nécessaire

[tool.setuptools]
packages = ["pushbullet"]
package-dir = {"" = "."}
